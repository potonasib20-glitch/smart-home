<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background:#000; color:#fff; text-align:center; padding-top:50px; font-family:sans-serif;">
    <h1 id="status" style="color:red;">SEDANG MENGHUBUNGKAN...</h1>
    <script>
        try {
            var ws = new WebSocket("wss://broker.emqx.io:443/mqtt");
            
            ws.onopen = function() {
                document.getElementById("status").innerText = "BERHASIL TERHUBUNG!";
                document.getElementById("status").style.color = "#22c55e";
            };
            
            ws.onerror = function() {
                document.getElementById("status").innerText = "GAGAL! WEBVIEW MEMBLOKIR WEBSOCKET";
                document.getElementById("status").style.color = "#ef4444";
            };
            
            ws.onclose = function() {
                document.getElementById("status").innerText = "KONEKSI TERPUTUS";
                document.getElementById("status").style.color = "#f97316";
            };
        } catch (e) {
            document.getElementById("status").innerText = "ERROR: " + e.message;
        }
    </script>
</body>
</html>
